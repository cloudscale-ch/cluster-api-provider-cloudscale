---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: cloudscalemachinetemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: CloudscaleMachineTemplate
    listKind: CloudscaleMachineTemplateList
    plural: cloudscalemachinetemplates
    singular: cloudscalemachinetemplate
  scope: Namespaced
  versions:
  - name: v1beta2
    schema:
      openAPIV3Schema:
        description: |-
          CloudscaleMachineTemplate is the immutable template a MachineDeployment or
          KubeadmControlPlane uses to stamp out CloudscaleMachines. Its Status.Capacity
          reports the CPU/memory of the chosen flavor (plus the root volume size) so
          the cluster autoscaler can scale a MachineDeployment up from zero replicas.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CloudscaleMachineTemplate
            properties:
              template:
                description: Template contains the machine template specification.
                properties:
                  spec:
                    description: Spec is the specification of the desired behavior
                      of the machine.
                    properties:
                      flavor:
                        description: |-
                          Flavor is the cloudscale.ch server flavor slug, e.g. "flex-4-2" or
                          "plus-8-4". List available flavors via the cloudscale API
                          (`GET /v1/flavors`) or the control panel.
                          Immutable after machine creation.
                        minLength: 1
                        type: string
                      image:
                        description: |-
                          Image identifies the OS image used to boot the server. One of:
                          - a public image slug (e.g. "ubuntu-24.04"),
                          - a custom image slug (e.g. "custom:ubuntu-2404-kube-v1.36.0"), or
                          - a custom image UUID.
                          For Kubernetes nodes you typically want a custom image built with
                          image-builder (https://image-builder.sigs.k8s.io/) that already contains
                          kubelet, containerd, and the chosen Kubernetes version.
                        minLength: 1
                        type: string
                      interfaces:
                        description: |-
                          Interfaces define the network interfaces to attach to the server.
                          When omitted, the controller defaults to the first cluster network and a public interface
                          at runtime (cross-resource resolution that the webhook cannot do).
                          If the cluster uses a floating IP without a load balancer, the control-plane
                          machine template must explicitly include a public interface ({type: public}).
                          cloudscale.ch requires a public IPv4 address on the server to assign a floating IP.
                        items:
                          description: |-
                            InterfaceSpec defines a network interface to attach to a server.
                            Exactly one of Type or Network must be specified.
                          properties:
                            ipFamily:
                              description: |-
                                IPFamily controls IPv4/IPv6 for a public interface.
                                Only valid when Type is "public".
                                Maps to the cloudscale API's per-server use_ipv6 setting:
                                  - IPv4: use_ipv6=false (IPv4 only)
                                  - DualStack: use_ipv6=true (IPv4 + IPv6)
                              enum:
                              - IPv4
                              - DualStack
                              type: string
                            network:
                              description: |-
                                Network references a named network from CloudscaleCluster.spec.networks.
                                Mutually exclusive with Type.
                              type: string
                            type:
                              description: |-
                                Type is "public" for a public internet interface.
                                Mutually exclusive with Network.
                              enum:
                              - public
                              type: string
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      providerID:
                        description: |-
                          ProviderID is the unique identifier as specified by the cloud provider.
                          Format: cloudscale://<server-uuid>
                        type: string
                      rootVolumeSize:
                        description: |-
                          RootVolumeSize is the root volume size in GB. Minimum 10. If unset, the
                          cloudscale.ch default for the chosen flavor is used.
                        minimum: 10
                        type: integer
                      serverGroup:
                        description: |-
                          ServerGroup configures anti-affinity placement.
                          When specified, machines in the same server group are placed on different physical hosts.
                          N.B.: Only **up to 4 machines** can be placed in the same server group.
                        properties:
                          name:
                            description: |-
                              Name is the server group name. Machines with the same server group name
                              in the same zone are placed on different physical hosts. The group is
                              created automatically the first time CAPCS sees the name.
                              Immutable after machine creation.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      tags:
                        additionalProperties:
                          type: string
                        description: |-
                          Tags are user-defined key/value pairs applied to the server as cloudscale
                          tags. CAPCS additionally sets its own ownership tag with the key
                          "capcs-cluster-<cluster-name>"; do not set keys with the "capcs-" prefix.
                        type: object
                    required:
                    - flavor
                    - image
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
          status:
            description: status defines the observed state of CloudscaleMachineTemplate
            properties:
              capacity:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: |-
                  Capacity defines the resource capacity for nodes created from this template.
                  This value is used for autoscaling from zero operations as defined in:
                  https://github.com/kubernetes-sigs/cluster-api/blob/main/docs/proposals/20210310-opt-in-autoscaling-from-zero.md
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the CloudscaleMachineTemplate resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
