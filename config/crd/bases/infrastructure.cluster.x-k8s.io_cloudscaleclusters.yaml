---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: cloudscaleclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: CloudscaleCluster
    listKind: CloudscaleClusterList
    plural: cloudscaleclusters
    singular: cloudscalecluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: Infrastructure provisioned
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: string
    - description: cloudscale.ch region
      jsonPath: .spec.region
      name: Region
      type: string
    - description: Control plane endpoint
      jsonPath: .spec.controlPlaneEndpoint.host
      name: Endpoint
      type: string
    name: v1beta2
    schema:
      openAPIV3Schema:
        description: |-
          CloudscaleCluster is the cloudscale.ch infrastructure for a CAPI Cluster.
          It owns the networks, control-plane load balancer, optional floating IP, and
          server groups that back the cluster's machines.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CloudscaleCluster
            properties:
              controlPlaneEndpoint:
                description: |-
                  ControlPlaneEndpoint represents the endpoint to communicate with the control plane.
                  This is set automatically from the load balancer's VIP address or floating IP.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              controlPlaneLoadBalancer:
                description: ControlPlaneLoadBalancer configures the load balancer
                  for the control plane.
                properties:
                  algorithm:
                    default: round_robin
                    description: |-
                      Algorithm is the cloudscale.ch load-balancing algorithm.
                      - "round_robin" (default): rotate requests across healthy backends.
                      - "least_connections": send each request to the backend with the fewest active connections.
                      - "source_ip": hash the client IP so the same client lands on the same backend.
                    enum:
                    - round_robin
                    - least_connections
                    - source_ip
                    type: string
                  apiServerPort:
                    default: 6443
                    description: |-
                      APIServerPort is the LB listener port exposed for the Kubernetes API
                      server. Defaults to 6443. The pool always targets the API server on the
                      control plane nodes' 6443.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  enabled:
                    default: true
                    description: |-
                      Enabled controls whether a load balancer is created for the control plane.
                      Set to false for external control planes (e.g., hosted control plane) where the endpoint
                      is provided externally, or when using a floating IP without a load balancer.
                    type: boolean
                  flavor:
                    default: lb-standard
                    description: |-
                      Flavor is the cloudscale.ch load balancer flavor slug. Defaults to
                      "lb-standard".
                    type: string
                  healthMonitor:
                    description: HealthMonitor configures the load balancer health
                      monitor.
                    properties:
                      delayS:
                        default: 5
                        description: DelayS is the interval between health checks
                          in seconds.
                        maximum: 300
                        minimum: 1
                        type: integer
                      downThreshold:
                        default: 3
                        description: DownThreshold is the number of failed checks
                          to mark unhealthy.
                        maximum: 10
                        minimum: 1
                        type: integer
                      timeoutS:
                        default: 3
                        description: TimeoutS is the health check timeout in seconds.
                        maximum: 300
                        minimum: 1
                        type: integer
                      upThreshold:
                        default: 2
                        description: UpThreshold is the number of successful checks
                          to mark healthy.
                        maximum: 10
                        minimum: 1
                        type: integer
                    type: object
                  network:
                    description: |-
                      Network places the LB VIP on a private network (internal LB).
                      References spec.networks[].name. Omit for a public LB.
                      When multiple networks are defined this field is required so the LB
                      pool members can be registered against a specific subnet.
                    type: string
                type: object
              credentialsRef:
                description: CredentialsRef references the Secret containing the cloudscale.ch
                  API token.
                properties:
                  name:
                    description: Name is the name of the Secret.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the Secret. Defaults to the
                      CloudscaleCluster's own namespace if unset.
                    type: string
                required:
                - name
                type: object
              floatingIP:
                description: |-
                  FloatingIP configures a floating IP for a stable control plane endpoint.
                  When the load balancer is enabled (recommended), the floating IP is assigned
                  to the LB, providing a stable IP that survives LB recreation.
                  When using a pre-existing floating IP without a load balancer, the user must
                  configure a dummy interface on the control plane servers (see cloudscale.ch docs)
                  and ensure the control-plane machine template includes a public interface
                  ({type: public}), as cloudscale.ch requires a public IPv4 address to assign
                  a floating IP to a server.
                  Managed floating IPs require the load balancer to be enabled.
                  Floating IPs cannot be attached to a load balancer with a private VIP
                  (i.e. one whose ControlPlaneLoadBalancer.Network is set).
                properties:
                  address:
                    description: |-
                      Address references a pre-existing floating IP by its address.
                      cloudscale.ch identifies floating IPs by their IP address rather than by UUID.
                      The floating IP is not deleted on cluster teardown.
                      Mutually exclusive with IPFamily.
                    type: string
                  ipFamily:
                    description: |-
                      IPFamily creates a new floating IP with this IP version.
                      A floating IP is a single address, so DualStack is not valid here.
                      Mutually exclusive with Address.
                    enum:
                    - IPv4
                    - IPv6
                    type: string
                type: object
              networks:
                description: |-
                  Networks define the private networks for this cluster.
                  Referenced by name from machine interface specs and LB config.
                  If empty, defaults to a single managed network named after the cluster.
                items:
                  description: |-
                    NetworkSpec defines a private network for the cluster.
                    Exactly one of UUID or CIDR must be specified.
                  properties:
                    cidr:
                      description: |-
                        CIDR defines the subnet for a controller-managed network.
                        The network and subnet are created and deleted by CAPCS.
                        Mutually exclusive with UUID.
                      type: string
                    gatewayAddress:
                      description: |-
                        GatewayAddress is the gateway IP address for the subnet.
                        Only applicable when CIDR is set (managed network).
                        By default, no gateway is configured on the subnet. This ensures
                        that outbound internet traffic uses the public network interface.
                        Set this to a specific IP address (e.g., "10.0.0.1") only if you have configured
                        a NAT gateway or similar infrastructure on the private network.
                      type: string
                    name:
                      description: |-
                        Name identifies this network within the cluster.
                        Used to reference this network from machine interface specs and LB config.
                      maxLength: 63
                      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                      type: string
                    uuid:
                      description: |-
                        UUID references a pre-existing cloudscale.ch network.
                        The network is not deleted on cluster teardown.
                        Mutually exclusive with CIDR.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              region:
                description: |-
                  Region is the cloudscale.ch region the cluster is provisioned in.
                  Determines the default zone and the set of available flavors.
                  Immutable after cluster creation.
                enum:
                - rma
                - lpg
                type: string
              zone:
                description: |-
                  Zone is the cloudscale.ch zone within Region.
                  Defaults to Region + "1" (e.g., "rma1", "lpg1"). Set explicitly only when
                  the region offers multiple zones and you need to pin the cluster to one.
                  Immutable after cluster creation.
                type: string
            required:
            - credentialsRef
            - region
            type: object
          status:
            description: status defines the observed state of CloudscaleCluster
            properties:
              conditions:
                description: conditions represent the current state of the CloudscaleCluster
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              floatingIP:
                description: FloatingIP is the cloudscale.ch floating IP.
                type: string
              initialization:
                description: Initialization contains v1beta2 initialization tracking.
                properties:
                  provisioned:
                    description: |-
                      Provisioned indicates that all cluster infrastructure has been provisioned.
                      True when Network, Subnet, Load Balancer, and Control Plane Endpoint are ready.
                    type: boolean
                type: object
              loadBalancerHealthMonitorID:
                description: LoadBalancerHealthMonitorID is the cloudscale.ch load
                  balancer health monitor UUID.
                type: string
              loadBalancerID:
                description: LoadBalancerID is the cloudscale.ch load balancer UUID.
                type: string
              loadBalancerListenerID:
                description: LoadBalancerListenerID is the cloudscale.ch load balancer
                  listener UUID for the API server.
                type: string
              loadBalancerMemberIDs:
                description: LoadBalancerMemberIDs are the list of nodes attached
                  to the loadBalancer.
                items:
                  type: string
                type: array
              loadBalancerPoolID:
                description: LoadBalancerPoolID is the cloudscale.ch load balancer
                  pool UUID for the API server.
                type: string
              networks:
                description: Networks track the status of each network defined in
                  spec.networks.
                items:
                  description: NetworkStatus tracks the provisioned state of a single
                    network.
                  properties:
                    cidr:
                      description: |-
                        CIDR is the subnet CIDR block.
                        Set from spec for managed networks or discovered from the API for pre-existing networks.
                      type: string
                    managed:
                      description: |-
                        Managed indicates whether CAPCS manages this network's lifecycle.
                        false for pre-existing networks (referenced by UUID), true for CAPCS-created networks (defined by CIDR).
                      type: boolean
                    name:
                      description: Name matches the logical name from spec.networks[].name.
                      type: string
                    networkID:
                      description: NetworkID is the cloudscale.ch network UUID.
                      type: string
                    subnetID:
                      description: SubnetID is the cloudscale.ch subnet UUID.
                      type: string
                  required:
                  - managed
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the latest generation observed
                  by the controller.
                format: int64
                minimum: 1
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
