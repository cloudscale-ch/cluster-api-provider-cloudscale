---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: cloudscaleclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: CloudscaleCluster
    listKind: CloudscaleClusterList
    plural: cloudscaleclusters
    singular: cloudscalecluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: Infrastructure provisioned
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: string
    - description: cloudscale.ch region
      jsonPath: .spec.region
      name: Region
      type: string
    - description: Control plane endpoint
      jsonPath: .spec.controlPlaneEndpoint.host
      name: Endpoint
      type: string
    name: v1beta2
    schema:
      openAPIV3Schema:
        description: |-
          CloudscaleCluster is the cloudscale.ch infrastructure for a CAPI Cluster.
          It owns the networks, control-plane load balancer, optional floating IP, and
          server groups that back the cluster's machines.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CloudscaleCluster
            properties:
              controlPlaneEndpoint:
                description: |-
                  ControlPlaneEndpoint represents the endpoint to communicate with the control plane.
                  This is set automatically from the load balancer's VIP address or floating IP.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              controlPlaneLoadBalancer:
                description: ControlPlaneLoadBalancer configures the load balancer
                  for the control plane.
                properties:
                  algorithm:
                    default: round_robin
                    description: |-
                      Algorithm is the cloudscale.ch load-balancing algorithm.
                      - "round_robin" (default): rotate requests across healthy backends.
                      - "least_connections": send each request to the backend with the fewest active connections.
                      - "source_ip": hash the client IP so the same client lands on the same backend.
                    enum:
                    - round_robin
                    - least_connections
                    - source_ip
                    type: string
                  apiServerPort:
                    default: 6443
                    description: |-
                      APIServerPort is the LB listener port exposed for the Kubernetes API
                      server. Defaults to 6443. The pool always targets the API server on the
                      control plane nodes' 6443.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  enabled:
                    default: true
                    description: |-
                      Enabled controls whether a load balancer is created for the control plane.
                      Set to false for external control planes (e.g., hosted control plane) where the endpoint
                      is provided externally, or when using a floating IP without a load balancer.
                    type: boolean
                  flavor:
                    default: lb-standard
                    description: |-
                      Flavor is the cloudscale.ch load balancer flavor slug. Defaults to
                      "lb-standard".
                    type: string
                  healthMonitor:
                    description: HealthMonitor configures the load balancer health
                      monitor.
                    properties:
                      delayS:
                        default: 5
                        description: DelayS is the interval between health checks
                          in seconds.
                        maximum: 300
                        minimum: 1
                        type: integer
                      downThreshold:
                        default: 3
                        description: DownThreshold is the number of failed checks
                          to mark unhealthy.
                        maximum: 10
                        minimum: 1
                        type: integer
                      timeoutS:
                        default: 3
                        description: TimeoutS is the health check timeout in seconds.
                        maximum: 300
                        minimum: 1
                        type: integer
                      upThreshold:
                        default: 2
                        description: UpThreshold is the number of successful checks
                          to mark healthy.
                        maximum: 10
                        minimum: 1
                        type: integer
                    type: object
                  network:
                    description: |-
                      Network places the LB VIP on a private network (internal LB).
                      References spec.networks[].name. Omit for a public LB.
                      When multiple networks are defined, either this field or PoolMemberNetwork
                      is required so the LB pool members can be registered against a specific subnet.
                    type: string
                  poolMemberNetwork:
                    description: |-
                      PoolMemberNetwork selects the network whose subnet the LB pool members are
                      registered on (i.e. the network the control-plane machines attach to).
                      References spec.networks[].name. When unset, the controller resolves the member
                      subnet from Network, or from the first network if that is unset too; the field
                      itself is left empty rather than defaulted. Set it when the control-plane nodes
                      live on a different network than the VIP (Network), e.g. a public VIP with
                      private control-plane nodes, or a private VIP on a dedicated access network.
                      Strictly immutable: it cannot be changed, nor set after creation.
                    type: string
                type: object
              credentialsRef:
                description: CredentialsRef references the Secret containing the cloudscale.ch
                  API token.
                properties:
                  name:
                    description: Name is the name of the Secret.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the Secret. Defaults to the
                      CloudscaleCluster's own namespace if unset.
                    type: string
                required:
                - name
                type: object
              floatingIP:
                description: |-
                  FloatingIP configures a floating IP for a stable control plane endpoint.
                  When the load balancer is enabled (recommended), the floating IP is assigned
                  to the LB, providing a stable IP that survives LB recreation.
                  When using a pre-existing floating IP without a load balancer, the user must
                  configure a dummy interface on the control plane servers (see cloudscale.ch docs)
                  and ensure the control-plane machine template includes a public interface
                  ({type: public}), as cloudscale.ch requires a public IPv4 address to assign
                  a floating IP to a server.
                  Managed floating IPs require the load balancer to be enabled.
                  Floating IPs cannot be attached to a load balancer with a private VIP
                  (i.e. one whose ControlPlaneLoadBalancer.Network is set).
                properties:
                  address:
                    description: |-
                      Address references a pre-existing floating IP by its address.
                      cloudscale.ch identifies floating IPs by their IP address rather than by UUID.
                      The floating IP is not deleted on cluster teardown.
                      Mutually exclusive with IPFamily.
                    type: string
                  ipFamily:
                    description: |-
                      IPFamily creates a new floating IP with this IP version.
                      A floating IP is a single address, so DualStack is not valid here.
                      Mutually exclusive with Address.
                    enum:
                    - IPv4
                    - IPv6
                    type: string
                type: object
              networks:
                description: |-
                  Networks define the private networks for this cluster.
                  Referenced by name from machine interface specs and LB config.
                  If empty, defaults to a single managed network named after the cluster.
                items:
                  description: |-
                    NetworkSpec defines a private network for the cluster.
                    Exactly one of UUID or CIDR must be specified.
                  properties:
                    cidr:
                      description: |-
                        CIDR defines the subnet for a controller-managed network.
                        The network and subnet are created and deleted by CAPCS.
                        Mutually exclusive with UUID.
                      type: string
                    gatewayAddress:
                      description: |-
                        GatewayAddress is the gateway IP address for the subnet.
                        Only applicable when CIDR is set (managed network). Immutable after creation.
                        When no router interface references this network: By default, no gateway is configured on the subnet. This ensures
                        that outbound internet traffic uses the public network interface.
                        When a router interface references this network: the value is requested as the router interface's IP on the subnet.
                        If empty, the webhook defaults this to a valid address.
                      type: string
                    name:
                      description: |-
                        Name identifies this network within the cluster.
                        Used to reference this network from machine interface specs and LB config.
                      maxLength: 63
                      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                      type: string
                    uuid:
                      description: |-
                        UUID references a pre-existing cloudscale.ch network.
                        The network is not deleted on cluster teardown.
                        Mutually exclusive with CIDR.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              region:
                description: |-
                  Region is the cloudscale.ch region the cluster is provisioned in.
                  Determines the default zone and the set of available flavors.
                  Immutable after cluster creation.
                enum:
                - rma
                - lpg
                type: string
              routers:
                description: |-
                  Routers define routers for this cluster.
                  Each router can be attached to one or more networks via its interfaces.
                  If empty, no router is provisioned.
                items:
                  description: |-
                    RouterSpec defines a router managed or adopted for this cluster.
                    Set UUID to adopt a pre-existing router; leave it empty to have CAPCS create one.
                  properties:
                    interfaces:
                      description: |-
                        Interfaces lists the networks this router is attached to.
                        A router attaches to any given network at most once.
                      items:
                        description: RouterInterfaceSpec defines a single network
                          attachment for a router.
                        properties:
                          address:
                            description: |-
                              Address is the IP requested for this router interface within the referenced
                              network's subnet. The API requires an explicit address per interface, so the
                              admission webhook defaults it: the interface with configureSubnetGateway=true gets
                              the network's gatewayAddress, or the first free address in the network's CIDR if
                              that is unset. Must be set explicitly when the network is referenced by uuid — its
                              subnet is not known at admission time. Must be left empty when this interface is
                              adopted by uuid: its address is whatever the pre-existing interface holds.
                              If configureSubnetGateway=true, the controller writes the resulting value to status.networks[].gatewayAddress once
                              the subnet gateway is configured. Immutable after creation.
                            type: string
                          configureSubnetGateway:
                            default: true
                            description: |-
                              ConfigureSubnetGateway, when true (default), sets the subnet's gatewayAddress
                              to this router interface's assigned IP, making the router the default route for
                              servers on that subnet.
                              Set to false for transit/backbone networks where a different router (e.g. the
                              internet-gateway router) owns the subnet gateway.
                              Immutable after creation.
                            type: boolean
                          network:
                            description: Network references spec.networks[].name.
                            type: string
                          uuid:
                            description: |-
                              UUID adopts a pre-existing interface of the router instead of attaching a new one.
                              The interface must already be attached to the referenced network. CAPCS reads its
                              address but never creates or detaches it.
                              Only valid on an adopted router (spec.routers[].uuid set), since a router CAPCS
                              creates has no pre-existing interfaces. Mutually exclusive with Address.
                              Immutable after creation.
                            type: string
                        required:
                        - network
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - network
                      x-kubernetes-list-type: map
                    internetGateway:
                      description: |-
                        InternetGateway enables SNAT for outbound internet access on a managed router.
                        Only valid when UUID is not set. Immutable after creation.
                      type: boolean
                    name:
                      description: Name identifies this router within the cluster.
                      maxLength: 63
                      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                      type: string
                    uuid:
                      description: |-
                        UUID references a pre-existing router by UUID.
                        CAPCS attaches and detaches the interfaces it created but does not create or delete
                        the router, and leaves interfaces it did not create alone. Interfaces the router
                        already carries must be adopted explicitly via interfaces[].uuid.
                        Mutually exclusive with InternetGateway. Immutable after creation.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              zone:
                description: |-
                  Zone is the cloudscale.ch zone within Region.
                  Defaults to Region + "1" (e.g., "rma1", "lpg1"). Set explicitly only when
                  the region offers multiple zones and you need to pin the cluster to one.
                  Immutable after cluster creation.
                type: string
            required:
            - credentialsRef
            - region
            type: object
          status:
            description: status defines the observed state of CloudscaleCluster
            properties:
              conditions:
                description: conditions represent the current state of the CloudscaleCluster
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              floatingIP:
                description: FloatingIP is the cloudscale.ch floating IP.
                type: string
              initialization:
                description: Initialization contains v1beta2 initialization tracking.
                properties:
                  provisioned:
                    description: |-
                      Provisioned indicates that all cluster infrastructure has been provisioned.
                      True when Network, Subnet, Load Balancer, and Control Plane Endpoint are ready.
                    type: boolean
                type: object
              loadBalancerHealthMonitorID:
                description: LoadBalancerHealthMonitorID is the cloudscale.ch load
                  balancer health monitor UUID.
                type: string
              loadBalancerID:
                description: LoadBalancerID is the cloudscale.ch load balancer UUID.
                type: string
              loadBalancerListenerID:
                description: LoadBalancerListenerID is the cloudscale.ch load balancer
                  listener UUID for the API server.
                type: string
              loadBalancerMemberIDs:
                description: LoadBalancerMemberIDs are the list of nodes attached
                  to the loadBalancer.
                items:
                  type: string
                type: array
              loadBalancerPoolID:
                description: LoadBalancerPoolID is the cloudscale.ch load balancer
                  pool UUID for the API server.
                type: string
              networks:
                description: Networks track the status of each network defined in
                  spec.networks.
                items:
                  description: NetworkStatus tracks the provisioned state of a single
                    network.
                  properties:
                    cidr:
                      description: |-
                        CIDR is the subnet CIDR block.
                        Set from spec for managed networks or discovered from the API for pre-existing networks.
                      type: string
                    gatewayAddress:
                      description: |-
                        GatewayAddress is the subnet gateway IP that CAPCS has configured on the router interface.
                        Empty until the router interface is attached and the subnet gateway is updated.
                      type: string
                    managed:
                      description: |-
                        Managed indicates whether CAPCS manages this network's lifecycle.
                        false for pre-existing networks (referenced by UUID), true for CAPCS-created networks (defined by CIDR).
                      type: boolean
                    name:
                      description: Name matches the logical name from spec.networks[].name.
                      type: string
                    networkID:
                      description: NetworkID is the cloudscale.ch network UUID.
                      type: string
                    subnetID:
                      description: SubnetID is the cloudscale.ch subnet UUID.
                      type: string
                  required:
                  - managed
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the latest generation observed
                  by the controller.
                format: int64
                minimum: 1
                type: integer
              routers:
                description: Routers track the provisioned state of each router defined
                  in spec.routers.
                items:
                  description: RouterStatus tracks the provisioned state of a single
                    router.
                  properties:
                    interfaces:
                      description: Interfaces tracks this router's interfaces, at
                        most one per network.
                      items:
                        description: RouterInterfaceStatus tracks one router interface.
                        properties:
                          interfaceID:
                            description: |-
                              InterfaceID is the router interface UUID.
                              Empty only while an attach is in flight: the entry is written before the create call,
                              so an attach whose response was lost to a timeout is still recognized as CAPCS-created.
                            type: string
                          managed:
                            description: |-
                              Managed indicates whether CAPCS created this interface, i.e. whether the spec entry
                              left uuid empty. Interfaces adopted by uuid are never detached on teardown.
                            type: boolean
                          network:
                            description: Network matches spec.networks[].name.
                            type: string
                        required:
                        - managed
                        - network
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - network
                      x-kubernetes-list-type: map
                    managed:
                      description: |-
                        Managed indicates whether CAPCS manages this router's lifecycle.
                        false for pre-existing routers (referenced by UUID), true for CAPCS-created routers.
                      type: boolean
                    name:
                      description: Name matches spec.routers[].name.
                      type: string
                    routerID:
                      description: RouterID is the router UUID.
                      type: string
                  required:
                  - managed
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
