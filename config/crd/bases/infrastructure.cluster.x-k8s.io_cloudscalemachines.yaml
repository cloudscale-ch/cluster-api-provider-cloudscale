    controller-gen.kubebuilder.io/version: v0.21.0
  name: cloudscalemachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: CloudscaleMachine
    listKind: CloudscaleMachineList
    plural: cloudscalemachines
    singular: cloudscalemachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: Machine provisioned
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: string
    - description: cloudscale.ch server ID
      jsonPath: .spec.providerID
      name: ProviderID
      type: string
    - description: Machine object
      jsonPath: .metadata.ownerReferences[?(@.kind=="Machine")].name
      name: Machine
      type: string
    name: v1beta2
    schema:
      openAPIV3Schema:
        description: CloudscaleMachine is the Schema for the cloudscalemachines API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CloudscaleMachine
            properties:
              flavor:
                description: Flavor is the cloudscale.ch server flavor (e.g., "flex-8-4").
                minLength: 1
                type: string
              image:
                description: Image is the OS image slug (e.g., "ubuntu-24.04"), custom
                  image slug (e.g., "custom:ubuntu-foo"), or custom image UUID.
                minLength: 1
                type: string
              interfaces:
                description: |-
                  Interfaces define the network interfaces to attach to the server.
                  When omitted, the controller defaults to the first cluster network and a public interface
                  at runtime (cross-resource resolution that the webhook cannot do).
                  If the cluster uses a floating IP without a load balancer, the control-plane
                  machine template must explicitly include a public interface ({type: public}).
                  cloudscale.ch requires a public IPv4 address on the server to assign a floating IP.
                items:
                  description: |-
                    InterfaceSpec defines a network interface to attach to a server.
                    Exactly one of Type or Network must be specified.
                  properties:
                    ipFamily:
                      description: |-
                        IPFamily controls IPv4/IPv6 for a public interface.
                        Only valid when Type is "public".
                        Maps to the cloudscale API's per-server use_ipv6 setting:
                          - IPv4: use_ipv6=false (IPv4 only)
                          - DualStack: use_ipv6=true (IPv4 + IPv6)
                      enum:
                      - IPv4
                      - DualStack
                      type: string
                    network:
                      description: |-
                        Network references a named network from CloudscaleCluster.spec.networks.
                        Mutually exclusive with Type.
                      type: string
                    type:
                      description: |-
                        Type is "public" for a public internet interface.
                        Mutually exclusive with Network.
                      enum:
                      - public
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              providerID:
                description: |-
                  ProviderID is the unique identifier as specified by the cloud provider.
                  Format: cloudscale://<server-uuid>
                type: string
              rootVolumeSize:
                description: RootVolumeSize is the root volume size in GB.
                minimum: 10
                type: integer
              serverGroup:
                description: |-
                  ServerGroup configures anti-affinity placement.
                  When specified, machines in the same server group are placed on different physical hosts.
                  N.B.: Only **up to 4 machines** can be placed in the same server group.
                properties:
                  name:
                    description: |-
                      Name is the server group name. Machines with the same server group name
                      in the same zone will be placed on different physical hosts.
                      The server group is created automatically if it doesn't exist.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              tags:
                additionalProperties:
                  type: string
                description: Tags are key-value pairs to apply to the server.
                type: object
