                          "lpg").
                        enum:
                        - rma
                        - lpg
                        type: string
                      zone:
                        description: |-
                          Zone is the cloudscale.ch zone (e.g., "rma1", "lpg1").
                          Defaults to region + "1" if not specified.
                        type: string
