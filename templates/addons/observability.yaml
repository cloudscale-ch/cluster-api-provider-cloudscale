# Observability stack for long-running test clusters.
#
# Deploys:
#   - Grafana Loki v3.7.2 (single binary, filesystem backend, PVC on cloudscale-volume-ssd)
#   - Grafana Alloy v1.16.1 (DaemonSet collector: pod logs + journald + Kubernetes events)
#   - Grafana v13.0.1 (ClusterIP, accessed via `kubectl port-forward`)
#
# Requires the `csi-cloudscale` addon (PVC needs the StorageClass it provides).
# Activate on a cluster by labelling it `observability: enabled`. For the PVC
# to bind, the cluster also needs `csi: cloudscale`.
#
# Configuration:
#   LOKI_RETENTION_HOURS         default 720h (30 days)
#   LOKI_VOLUME_SIZE             default 20Gi
#   GRAFANA_ADMIN_PASSWORD       default admin (fine for port-forward-only)
apiVersion: v1
kind: ConfigMap
metadata:
  name: "observability"
  namespace: "${NAMESPACE}"
data:
  observability.yaml: |
    ---
    apiVersion: v1
    kind: Namespace
    metadata:
      name: observability
    ---
    # ============================================================================
    # Loki
    # ============================================================================
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: loki-config
      namespace: observability
    data:
      loki.yaml: |
        auth_enabled: false
        server:
          http_listen_port: 3100
          grpc_listen_port: 9095
          log_level: info
        common:
          path_prefix: /var/loki
          storage:
            filesystem:
              chunks_directory: /var/loki/chunks
              rules_directory: /var/loki/rules
          replication_factor: 1
          ring:
            kvstore:
              store: inmemory
        schema_config:
          configs:
            - from: 2024-01-01
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        storage_config:
          tsdb_shipper:
            active_index_directory: /var/loki/tsdb-index
            cache_location: /var/loki/tsdb-cache
          filesystem:
            directory: /var/loki/chunks
        limits_config:
          retention_period: ${LOKI_RETENTION_HOURS:=720h}
          allow_structured_metadata: true
          volume_enabled: true
        ruler:
          storage:
            type: local
            local:
              directory: /var/loki/rules
          rule_path: /var/loki/rules-tmp
          ring:
            kvstore:
              store: inmemory
          enable_api: true
        compactor:
          working_directory: /var/loki/compactor
          delete_request_store: filesystem
          retention_enabled: true
        analytics:
          reporting_enabled: false
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: loki
      namespace: observability
      labels:
        app.kubernetes.io/name: loki
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: loki
      ports:
        - name: http
          port: 3100
          targetPort: 3100
        - name: grpc
          port: 9095
          targetPort: 9095
    ---
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: loki
      namespace: observability
      labels:
        app.kubernetes.io/name: loki
    spec:
      serviceName: loki
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: loki
      template:
        metadata:
          labels:
            app.kubernetes.io/name: loki
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: loki
              image: grafana/loki:3.7.2
              imagePullPolicy: IfNotPresent
              args:
                - "-config.file=/etc/loki/loki.yaml"
              ports:
                - name: http
                  containerPort: 3100
                - name: grpc
                  containerPort: 9095
              readinessProbe:
                httpGet:
                  path: /ready
                  port: http
                initialDelaySeconds: 30
                periodSeconds: 10
              volumeMounts:
                - name: config
                  mountPath: /etc/loki
                - name: storage
                  mountPath: /var/loki
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: config
              configMap:
                name: loki-config
      volumeClaimTemplates:
        - metadata:
            name: storage
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: cloudscale-volume-ssd
            resources:
              requests:
                storage: ${LOKI_VOLUME_SIZE:=20Gi}
    ---
    # ============================================================================
    # Alloy (collector)
    # ============================================================================
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: alloy
      namespace: observability
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: alloy
    rules:
      - apiGroups: [""]
        resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods", "pods/log", "events", "namespaces"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["discovery.k8s.io"]
        resources: ["endpointslices"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["configmaps", "secrets"]
        verbs: ["get", "list", "watch"]
      - nonResourceURLs: ["/metrics"]
        verbs: ["get"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: alloy
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: alloy
    subjects:
      - kind: ServiceAccount
        name: alloy
        namespace: observability
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: alloy-config
      namespace: observability
    data:
      config.alloy: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        // -------- pod/container logs --------
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // Rename __meta_* attributes to plain labels so they survive loki.write
        // filtering (loki.write strips any label whose name starts with "__").
        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid"]
            target_label  = "uid"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_ip"]
            target_label  = "pod_ip"
          }

          // Standard "app" label — common across most workloads
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }

          // Kubernetes canonical labels (https://kubernetes.io/docs/concepts/overview/working-with-labels/)
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app_kubernetes_io_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
            target_label  = "app_kubernetes_io_instance"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
            target_label  = "app_kubernetes_io_component"
          }

          // Controller kind and name (Deployment, StatefulSet, DaemonSet …)
          rule {
            source_labels = ["__meta_kubernetes_pod_controller_kind"]
            target_label  = "controller_kind"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_controller_name"]
            target_label  = "controller_name"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.write.default.receiver]
        }

        // -------- systemd journal --------
        discovery.relabel "journal" {
          targets = []
          rule {
            source_labels = ["__journal__systemd_unit"]
            target_label  = "unit"
          }
          rule {
            source_labels = ["__journal__hostname"]
            target_label  = "hostname"
          }
        }

        loki.source.journal "node" {
          path          = "/var/log/journal"
          forward_to    = [loki.write.default.receiver]
          relabel_rules = discovery.relabel.journal.rules
          labels        = {
            job  = "systemd-journal",
            node = sys.env("NODE_NAME"),
          }
        }

        // -------- Kubernetes events --------
        loki.source.kubernetes_events "events" {
          forward_to = [loki.write.default.receiver]
          log_format = "logfmt"
        }

        // -------- sink --------
        loki.write "default" {
          endpoint {
            url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
    ---
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: alloy
      namespace: observability
      labels:
        app.kubernetes.io/name: alloy
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: alloy
      template:
        metadata:
          labels:
            app.kubernetes.io/name: alloy
        spec:
          serviceAccountName: alloy
          hostPID: true
          tolerations:
            - operator: Exists
          containers:
            - name: alloy
              image: grafana/alloy:v1.16.1
              imagePullPolicy: IfNotPresent
              args:
                - "run"
                - "/etc/alloy/config.alloy"
                - "--storage.path=/var/lib/alloy/data"
                - "--server.http.listen-addr=0.0.0.0:12345"
              ports:
                - name: http
                  containerPort: 12345
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              securityContext:
                privileged: true
                runAsUser: 0
              volumeMounts:
                - name: config
                  mountPath: /etc/alloy
                - name: data
                  mountPath: /var/lib/alloy/data
                - name: varlog
                  mountPath: /var/log
                  readOnly: true
                - name: journal
                  mountPath: /var/log/journal
                  readOnly: true
                - name: machine-id
                  mountPath: /etc/machine-id
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: alloy-config
            - name: data
              emptyDir: {}
            - name: varlog
              hostPath:
                path: /var/log
            - name: journal
              hostPath:
                path: /var/log/journal
            - name: machine-id
              hostPath:
                path: /etc/machine-id
    ---
    # ============================================================================
    # Grafana
    # ============================================================================
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-datasources
      namespace: observability
    data:
      datasources.yaml: |
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki.observability.svc.cluster.local:3100
            isDefault: true
            editable: false
            jsonData:
              maxLines: 5000
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: grafana
      namespace: observability
      labels:
        app.kubernetes.io/name: grafana
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: grafana
      ports:
        - name: http
          port: 3000
          targetPort: 3000
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: grafana
      namespace: observability
      labels:
        app.kubernetes.io/name: grafana
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: grafana
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
          containers:
            - name: grafana
              image: grafana/grafana:13.0.1
              imagePullPolicy: IfNotPresent
              ports:
                - name: http
                  containerPort: 3000
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: admin-user
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: admin-password
                - name: GF_ANALYTICS_REPORTING_ENABLED
                  value: "false"
                - name: GF_ANALYTICS_CHECK_FOR_UPDATES
                  value: "false"
                - name: GF_AUTH_ANONYMOUS_ENABLED
                  value: "false"
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 10
              volumeMounts:
                - name: storage
                  mountPath: /var/lib/grafana
                - name: datasources
                  mountPath: /etc/grafana/provisioning/datasources
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: storage
              emptyDir: {}
            - name: datasources
              configMap:
                name: grafana-datasources
---
apiVersion: v1
kind: Secret
metadata:
  name: "observability-credentials"
  namespace: "${NAMESPACE}"
type: addons.cluster.x-k8s.io/resource-set
stringData:
  secret.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: grafana-admin
      namespace: observability
    type: Opaque
    stringData:
      admin-user: admin
      admin-password: "${GRAFANA_ADMIN_PASSWORD:=admin}"
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: "observability"
  namespace: "${NAMESPACE}"
spec:
  strategy: ApplyOnce
  clusterSelector:
    matchLabels:
      observability: enabled
  resources:
    - name: "observability"
      kind: ConfigMap
    - name: "observability-credentials"
      kind: Secret
