---
apiVersion: v1
kind: Secret
metadata:
  name: "${CLUSTER_NAME}-credentials"
  namespace: "${NAMESPACE}"
  labels:
    clusterctl.cluster.x-k8s.io/move: ""
type: Opaque
stringData:
  token: "${CLOUDSCALE_API_TOKEN}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: "${CLUSTER_NAME}"
  namespace: "${NAMESPACE}"
  labels:
    ccm: cloudscale
    cni: cilium
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["192.168.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
    serviceDomain: "cluster.local"
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: CloudscaleCluster
    name: "${CLUSTER_NAME}"
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: "${CLUSTER_NAME}-control-plane"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CloudscaleCluster
metadata:
  name: "${CLUSTER_NAME}"
  namespace: "${NAMESPACE}"
spec:
  region: "${CLOUDSCALE_REGION}"
  networks:
  - name: "${CLUSTER_NAME}"
    cidr: "${CLOUDSCALE_NETWORK_CIDR}"
    gatewayAddress: "" # disable gateway, use public interface for internet access
  controlPlaneLoadBalancer:
    enabled: true
  credentialsRef:
    name: "${CLUSTER_NAME}-credentials"
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: "${CLUSTER_NAME}-control-plane"
  namespace: "${NAMESPACE}"
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  version: "${KUBERNETES_VERSION}"
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: CloudscaleMachineTemplate
        name: "${CLUSTER_NAME}-control-plane"
  kubeadmConfigSpec:
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
    users:
      - name: capi
        groups: sudo
        shell: "/bin/bash"
        sudo: "ALL=(ALL) NOPASSWD:ALL"
        sshAuthorizedKeys:
          - "${CLOUDSCALE_SSH_PUBLIC_KEY}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CloudscaleMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-control-plane"
  namespace: "${NAMESPACE}"
spec:
  template:
    spec:
      flavor: "${CLOUDSCALE_CONTROL_PLANE_MACHINE_FLAVOR}"
      image: "${CLOUDSCALE_MACHINE_IMAGE}"
      rootVolumeSize: ${CLOUDSCALE_ROOT_VOLUME_SIZE}
