apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: quick-start-worker
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      initConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
          - name: cloud-provider
            value: external
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
          - name: cloud-provider
            value: external
      users:
      - groups: adm, sudo
        name: capi
        shell: /bin/bash
        sshAuthorizedKeys: []
        sudo: ALL=(ALL) NOPASSWD:ALL
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: quick-start
  namespace: ${NAMESPACE}
spec:
  controlPlane:
    healthCheck:
      checks:
        nodeStartupTimeoutSeconds: 900
        unhealthyNodeConditions:
        - status: Unknown
          timeoutSeconds: 300
          type: Ready
        - status: "False"
          timeoutSeconds: 300
          type: Ready
      remediation:
        triggerIf:
          unhealthyLessThanOrEqualTo: 33%
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: CloudscaleMachineTemplate
        name: quick-start-machinetemplate
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: quick-start-control-plane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: CloudscaleClusterTemplate
      name: quick-start-cluster
  patches:
  - definitions:
    - jsonPatches:
      - op: replace
        path: /spec/template/spec/region
        valueFrom:
          variable: region
      - op: replace
        path: /spec/template/spec/credentialsRef/name
        valueFrom:
          variable: credentialsRefName
      selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: CloudscaleClusterTemplate
        matchResources:
          infrastructureCluster: true
    name: CloudscaleClusterTemplate
  - definitions:
    - jsonPatches:
      - op: replace
        path: /spec/template/spec/flavor
        valueFrom:
          variable: cloudscaleControlPlaneMachineFlavor
      - op: replace
        path: /spec/template/spec/image
        valueFrom:
          variable: cloudscaleControlPlaneMachineImage
      - op: replace
        path: /spec/template/spec/rootVolumeSize
        valueFrom:
          variable: cloudscaleControlPlaneMachineRootVolumeSize
      - op: add
        path: /spec/template/spec/serverGroup
        valueFrom:
          template: |
            name: {{ .cloudscaleControlPlaneServerGroupName }}
      selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: CloudscaleMachineTemplate
        matchResources:
          controlPlane: true
    name: CloudscaleMachineTemplateControlPlane
  - definitions:
    - jsonPatches:
      - op: replace
        path: /spec/template/spec/flavor
        valueFrom:
          variable: cloudscaleWorkerMachineFlavor
      - op: replace
        path: /spec/template/spec/image
        valueFrom:
          variable: cloudscaleWorkerMachineImage
      - op: replace
        path: /spec/template/spec/rootVolumeSize
        valueFrom:
          variable: cloudscaleWorkerMachineRootVolumeSize
      - op: add
        path: /spec/template/spec/serverGroup
        valueFrom:
          template: |
            name: {{ .cloudscaleWorkerServerGroupName }}
      selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: CloudscaleMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - worker
    name: CloudscaleMachineTemplateWorker
  - definitions:
    - jsonPatches:
      - op: replace
        path: /spec/template/spec/kubeadmConfigSpec/users
        valueFrom:
          template: |
            - name: capi
              groups: "adm, sudo"
              shell: "/bin/bash"
              sudo: "ALL=(ALL) NOPASSWD:ALL"
              sshAuthorizedKeys: {{ .cloudscaleSSHKeys | toJson }}
      selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
    name: KubeadmControlPlaneTemplate
  - definitions:
    - jsonPatches:
      - op: replace
        path: /spec/template/spec/users
        valueFrom:
          template: |
            - name: capi
              groups: "adm, sudo"
              shell: "/bin/bash"
              sudo: "ALL=(ALL) NOPASSWD:ALL"
              sshAuthorizedKeys: {{ .cloudscaleSSHKeys | toJson }}
      selector:
        apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
        kind: KubeadmConfigTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - worker
    name: KubeadmConfigTemplate
  variables:
  - name: region
    required: true
    schema:
      openAPIV3Schema:
        default: lpg
        enum:
        - lpg
        - rma
        type: string
  - name: credentialsRefName
    required: true
    schema:
      openAPIV3Schema:
        default: ${CLUSTER_NAME}-credentials
        type: string
  - name: cloudscaleControlPlaneMachineFlavor
    required: true
    schema:
      openAPIV3Schema:
        default: flex-4-2
        type: string
  - name: cloudscaleControlPlaneMachineImage
    required: true
    schema:
      openAPIV3Schema:
        default: custom:ubuntu-2404-kube-v1.35.2
        type: string
  - name: cloudscaleControlPlaneMachineRootVolumeSize
    required: true
    schema:
      openAPIV3Schema:
        default: 20
        type: integer
  - name: cloudscaleWorkerMachineFlavor
    required: true
    schema:
      openAPIV3Schema:
        default: flex-4-2
        type: string
  - name: cloudscaleWorkerMachineImage
    required: true
    schema:
      openAPIV3Schema:
        default: custom:ubuntu-2404-kube-v1.35.2
        type: string
  - name: cloudscaleWorkerMachineRootVolumeSize
    required: true
    schema:
      openAPIV3Schema:
        default: 20
        type: integer
  - name: cloudscaleSSHKeys
    required: true
    schema:
      openAPIV3Schema:
        items:
          type: string
        type: array
  - name: cloudscaleControlPlaneServerGroupName
    required: true
    schema:
      openAPIV3Schema:
        type: string
  - name: cloudscaleWorkerServerGroupName
    required: true
    schema:
      openAPIV3Schema:
        type: string
  workers:
    machineDeployments:
    - bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: quick-start-worker
      class: worker
      healthCheck:
        checks:
          nodeStartupTimeoutSeconds: 600
          unhealthyNodeConditions:
          - status: Unknown
            timeoutSeconds: 300
            type: Ready
          - status: "False"
            timeoutSeconds: 300
            type: Ready
        remediation:
          triggerIf:
            unhealthyInRange: '[0-2]'
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: CloudscaleMachineTemplate
          name: quick-start-machinetemplate
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: quick-start-control-plane
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      kubeadmConfigSpec:
        initConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
            - name: cloud-provider
              value: external
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
            - name: cloud-provider
              value: external
        users:
        - groups: adm, sudo
          name: capi
          shell: /bin/bash
          sshAuthorizedKeys: []
          sudo: ALL=(ALL) NOPASSWD:ALL
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CloudscaleClusterTemplate
metadata:
  name: quick-start-cluster
  namespace: ${NAMESPACE}
spec:
  template:
    metadata:
      labels: {}
    spec:
      credentialsRef:
        name: ${CLUSTER_NAME}-credentials
      region: lpg
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CloudscaleMachineTemplate
metadata:
  name: quick-start-machinetemplate
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      flavor: flex-4-2
      image: custom:ubuntu-2404-kube-v1.35.2
      rootVolumeSize: 20
