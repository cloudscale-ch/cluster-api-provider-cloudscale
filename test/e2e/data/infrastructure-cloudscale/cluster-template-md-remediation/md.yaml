# Kustomize strategic merge patch for MachineDeployment.
# Adds the e2e.remediation.label to worker machine templates so they are
# selected by the MachineHealthCheck defined in mhc.yaml.
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-md-0"
  namespace: "${NAMESPACE}"
spec:
  template:
    metadata:
      labels:
        "e2e.remediation.label": ""
