---
# MachineHealthCheck targeting worker machines with label e2e.remediation.label="".
# Triggers remediation after 10s when the e2e.remediation.condition is False.
# Based on upstream CAPI Docker reference:
#   sigs.k8s.io/cluster-api/test/e2e/data/infrastructure-docker/main/cluster-template-md-remediation/mhc.yaml
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: "${CLUSTER_NAME}-mhc-0"
  namespace: "${NAMESPACE}"
spec:
  clusterName: "${CLUSTER_NAME}"
  selector:
    matchLabels:
      e2e.remediation.label: ""
  checks:
    unhealthyNodeConditions:
      - type: e2e.remediation.condition
        status: "False"
        timeoutSeconds: 10
  remediation:
    triggerIf:
      unhealthyLessThanOrEqualTo: 100%
